name: Sovereign Dominion CI/CD
on:
  push:
    branches: [main, 'production/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install
      - run: npm audit --audit-level=critical

  test:
    needs: [lint-typecheck, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install
      - run: npm test

  kernel:
    # @sovereign/kernel (kernel/) is its own package with its own
    # package.json/node_modules — the root `npm test` job above never touches
    # it. Without this job, kernel/test/*.test.mjs only ever ran locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install
        working-directory: kernel
      - run: npm test
        working-directory: kernel

  # Deployment is owned by the Cloudflare Pages Git integration (it builds and
  # deploys every push, and reports its own "Cloudflare Pages" check). The old
  # deploy-preview/deploy-production jobs here duplicated that via the
  # deprecated cloudflare/pages-action@v1 (bundles Wrangler v2, which no longer
  # runs on current runners) — and their `secrets` reference in a step `if:`
  # made GitHub reject this whole workflow file, so no job above ever ran.
  # This workflow gates merges; Cloudflare deploys.
